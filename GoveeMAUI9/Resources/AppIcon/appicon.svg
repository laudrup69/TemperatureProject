<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo del icono: degradado naranja. Sin esquinas: cada lanzador de Android
       aplica su propia forma (círculo, cuadrado redondeado...). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA24C"/>
      <stop offset="1" stop-color="#FF5F2E"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
</svg>
