# Publica una versión al subir una etiqueta vX.Y.Z:
#   git tag v2.2.0 && git push TemperatureGovee v2.2.0
# Compila el APK firmado y crea la release de GitHub con el APK adjunto.
# No ejecuta tests: todo lo que llega a main ya ha pasado el CI de su PR.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar workload MAUI
        run: dotnet workload install maui

      # La versión sale de la etiqueta. versionCode = mayor*10000 + menor*100 + parche
      # (v2.2.0 → 20200): siempre crece, y Android sólo instala encima si crece.
      - name: Versión desde la etiqueta
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Etiqueta '$tag' no válida: usa vX.Y.Z" }
          $code = [int]$Matches[1] * 10000 + [int]$Matches[2] * 100 + [int]$Matches[3]
          "VERSION_NAME=$($tag.Substring(1))" >> $env:GITHUB_ENV
          "VERSION_CODE=$code" >> $env:GITHUB_ENV
          Write-Host "versionName=$($tag.Substring(1)) versionCode=$code"

      # El keystore llega en base64 como secreto y se escribe fuera del repo.
      - name: Preparar keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.GOVEE_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Falta el secreto GOVEE_KEYSTORE_BASE64' }
          $path = Join-Path $env:RUNNER_TEMP 'govee.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "GOVEE_SIGNING_KEYSTORE=$path" >> $env:GITHUB_ENV

      # GoveeMAUI.csproj lee la firma de las variables GOVEE_SIGNING_*.
      - name: Compilar APK firmado
        shell: pwsh
        env:
          GOVEE_SIGNING_ALIAS: ${{ secrets.GOVEE_SIGNING_ALIAS }}
          GOVEE_SIGNING_KEYPASS: ${{ secrets.GOVEE_SIGNING_KEYPASS }}
          GOVEE_SIGNING_STOREPASS: ${{ secrets.GOVEE_SIGNING_STOREPASS }}
        run: >
          dotnet publish GoveeMAUI9/GoveeMAUI.csproj -f net9.0-android -c Release
          -p:ApplicationDisplayVersion=$env:VERSION_NAME
          -p:ApplicationVersion=$env:VERSION_CODE

      - name: Crear release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = "GoveeMAUI_${{ github.ref_name }}.apk"
          Copy-Item GoveeMAUI9/bin/Release/net9.0-android/publish/com.personal.goveetempcontrol-Signed.apk $apk
          gh release create '${{ github.ref_name }}' $apk --title 'Govee Temp Control ${{ github.ref_name }}' --generate-notes --verify-tag

      - name: Borrar keystore
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'govee.keystore') -ErrorAction SilentlyContinue
